<svg width="600" height="600" viewBox="0 0 600 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#152b38"/>
      <stop offset="45%" stop-color="#0f2027"/>
      <stop offset="100%" stop-color="#0b141a"/>
    </radialGradient>

    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#152b38" stop-opacity="0"/>
      <stop offset="55%" stop-color="#18313f" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0b141a" stop-opacity="0.95"/>
    </linearGradient>

    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e2f9ff" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="contactHaloBright" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="contactHaloDim" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vignette" cx="50%" cy="45%" r="72%">
      <stop offset="60%" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.9"/>
    </radialGradient>
  </defs>

  <!-- fundo -->
  <rect x="0" y="0" width="600" height="600" fill="#0d1117"/>
  <rect x="0" y="0" width="600" height="600" fill="url(#bgGrad)"/>

  <!-- faixa de agua ao fundo, sugerindo horizonte de porto -->
  <rect x="0" y="330" width="600" height="270" fill="url(#waterGrad)"/>

  <!-- silhueta de porto: guindaste portuario (STS gantry crane) -->
  <g fill="#18313f" opacity="0.62">
    <!-- pernas do portico -->
    <polygon points="330,522 350,522 372,352 356,352"/>
    <polygon points="452,522 472,522 456,352 440,352"/>
    <!-- viga horizontal do topo -->
    <polygon points="352,356 540,320 540,336 356,368"/>
    <!-- lanca traseira (back-reach) -->
    <polygon points="352,356 300,372 300,386 356,368"/>
    <!-- cabine do operador -->
    <polygon points="392,368 424,368 424,392 392,392"/>
    <!-- tirante diagonal -->
    <polygon points="404,360 540,326 540,331 404,364"/>
    <!-- torre de apoio central -->
    <polygon points="398,392 418,392 412,522 404,522"/>
  </g>

  <!-- pilha de conteineres -->
  <g opacity="0.58">
    <rect x="54" y="466" width="66" height="34" fill="#1a2a3a"/>
    <rect x="122" y="466" width="66" height="34" fill="#18313f"/>
    <rect x="54" y="430" width="66" height="34" fill="#18313f"/>
    <rect x="122" y="440" width="66" height="24" fill="#1a2a3a"/>
    <rect x="190" y="452" width="60" height="48" fill="#1a2a3a"/>
  </g>

  <!-- linha do cais -->
  <rect x="0" y="518" width="600" height="4" fill="#1a2a3a" opacity="0.7"/>

  <!-- ===== SONAR ===== -->
  <g>
    <!-- grade sutil em cruz -->
    <line x1="60" y1="250" x2="540" y2="250" stroke="#22d3ee" stroke-width="1" opacity="0.08"/>
    <line x1="300" y1="10" x2="300" y2="490" stroke="#22d3ee" stroke-width="1" opacity="0.08"/>

    <!-- marcas radiais a cada 30 graus -->
    <g stroke="#38bdf8" stroke-width="1.4" opacity="0.22">
      <line x1="300" y1="45" x2="300" y2="58" transform="rotate(0 300 250)"/>
      <line x1="300" y1="45" x2="300" y2="58" transform="rotate(30 300 250)"/>
      <line x1="300" y1="45" x2="300" y2="58" transform="rotate(60 300 250)"/>
      <line x1="300" y1="45" x2="300" y2="58" transform="rotate(90 300 250)"/>
      <line x1="300" y1="45" x2="300" y2="58" transform="rotate(120 300 250)"/>
      <line x1="300" y1="45" x2="300" y2="58" transform="rotate(150 300 250)"/>
      <line x1="300" y1="45" x2="300" y2="58" transform="rotate(180 300 250)"/>
      <line x1="300" y1="45" x2="300" y2="58" transform="rotate(210 300 250)"/>
      <line x1="300" y1="45" x2="300" y2="58" transform="rotate(240 300 250)"/>
      <line x1="300" y1="45" x2="300" y2="58" transform="rotate(270 300 250)"/>
      <line x1="300" y1="45" x2="300" y2="58" transform="rotate(300 300 250)"/>
      <line x1="300" y1="45" x2="300" y2="58" transform="rotate(330 300 250)"/>
    </g>

    <!-- feixe de varredura: leque de linhas com opacidade decrescente -->
    <g stroke="#67e8f9" stroke-linecap="round">
      <line x1="300" y1="250" x2="300" y2="44" stroke-width="2.6" opacity="0.55" transform="rotate(0 300 250)"/>
      <line x1="300" y1="250" x2="300" y2="44" stroke-width="2.2" opacity="0.42" transform="rotate(4 300 250)"/>
      <line x1="300" y1="250" x2="300" y2="44" stroke-width="1.9" opacity="0.33" transform="rotate(8 300 250)"/>
      <line x1="300" y1="250" x2="300" y2="44" stroke-width="1.7" opacity="0.26" transform="rotate(12 300 250)"/>
      <line x1="300" y1="250" x2="300" y2="44" stroke-width="1.5" opacity="0.20" transform="rotate(16 300 250)"/>
      <line x1="300" y1="250" x2="300" y2="44" stroke-width="1.3" opacity="0.15" transform="rotate(20 300 250)"/>
      <line x1="300" y1="250" x2="300" y2="44" stroke-width="1.2" opacity="0.11" transform="rotate(24 300 250)"/>
      <line x1="300" y1="250" x2="300" y2="44" stroke-width="1.1" opacity="0.08" transform="rotate(28 300 250)"/>
      <line x1="300" y1="250" x2="300" y2="44" stroke-width="1" opacity="0.06" transform="rotate(32 300 250)"/>
      <line x1="300" y1="250" x2="300" y2="44" stroke-width="1" opacity="0.04" transform="rotate(36 300 250)"/>
      <line x1="300" y1="250" x2="300" y2="44" stroke-width="1" opacity="0.03" transform="rotate(40 300 250)"/>
      <line x1="300" y1="250" x2="300" y2="44" stroke-width="1" opacity="0.02" transform="rotate(44 300 250)"/>
    </g>

    <!-- aneis concentricos -->
    <circle cx="300" cy="250" r="40" stroke="#22d3ee" stroke-width="1.3" opacity="0.5"/>
    <circle cx="300" cy="250" r="84" stroke="#38bdf8" stroke-width="1.1" opacity="0.38"/>
    <circle cx="300" cy="250" r="128" stroke="#22d3ee" stroke-width="1.1" opacity="0.28"/>
    <circle cx="300" cy="250" r="172" stroke="#38bdf8" stroke-width="1" opacity="0.2"/>
    <circle cx="300" cy="250" r="206" stroke="#22d3ee" stroke-width="1" opacity="0.14"/>

    <!-- polo do sonar -->
    <circle cx="300" cy="250" r="46" fill="url(#hubGlow)"/>
    <circle cx="300" cy="250" r="4.5" fill="#e2f9ff"/>
    <circle cx="300" cy="250" r="2.2" fill="#0d1117"/>

    <!-- contatos detectados, com halo -->
    <g>
      <circle cx="300" cy="82" r="20" fill="url(#contactHaloBright)"/>
      <circle cx="300" cy="82" r="3.4" fill="#e2f9ff"/>

      <g transform="rotate(150 300 250)">
        <circle cx="300" cy="122" r="16" fill="url(#contactHaloDim)"/>
        <circle cx="300" cy="122" r="2.8" fill="#a5f3fc"/>
      </g>

      <g transform="rotate(205 300 250)">
        <circle cx="300" cy="65" r="17" fill="url(#contactHaloDim)"/>
        <circle cx="300" cy="65" r="2.8" fill="#a5f3fc"/>
      </g>

      <g transform="rotate(255 300 250)">
        <circle cx="300" cy="140" r="15" fill="url(#contactHaloDim)"/>
        <circle cx="300" cy="140" r="2.6" fill="#7dd3fc"/>
      </g>

      <g transform="rotate(18 300 250)">
        <circle cx="300" cy="95" r="18" fill="url(#contactHaloBright)"/>
        <circle cx="300" cy="95" r="3" fill="#e2f9ff"/>
      </g>
    </g>
  </g>

  <!-- vinheta final para profundidade -->
  <rect x="0" y="0" width="600" height="600" fill="url(#vignette)"/>
</svg>
